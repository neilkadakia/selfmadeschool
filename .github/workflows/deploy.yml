name: Build and publish deploy branch

# Builds the static site and publishes out/ to the `deploy` branch.
# Hostinger's Git integration watches `deploy` and pulls it into
# public_html via webhook; no FTP credentials or secrets needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # PHP API (auth + progress) ships alongside the static site.
      - name: Bundle API into out/
        run: cp -r api out/api

      - name: Publish out/ to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: deploy
          commit_message: "Deploy: ${{ github.event.head_commit.message || 'manual run' }}"
